name: Publish SDK to GitHub Packages

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#sdk-v}" >> $GITHUB_OUTPUT

      - name: Set version
        working-directory: sdk/java
        run: |
          sed -i "s/^version = .*/version = '${{ steps.version.outputs.VERSION }}'/" build.gradle
          sed -i "s|<version>.*</version><!-- sdk-version -->|<version>${{ steps.version.outputs.VERSION }}</version><!-- sdk-version -->|" pom.xml

      - name: Build
        working-directory: sdk/java
        run: gradle build -x test

      - name: Publish to GitHub Packages
        working-directory: sdk/java
        run: gradle publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
