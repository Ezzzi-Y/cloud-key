basePath: /api
definitions:
  handler.ConsumeRequest:
    properties:
      amount:
        example: 1
        type: integer
      key:
        example: CK-xxxx-xxxx
        type: string
    required:
    - key
    type: object
  handler.CreateKeyJSON:
    properties:
      alias:
        example: 测试卡密
        type: string
      billing_mode:
        example: count
        type: string
      expire_at:
        example: "2025-12-31 23:59:59"
        type: string
      initial_amount:
        example: 100
        type: integer
      max_usage:
        example: 10
        type: integer
    required:
    - alias
    - billing_mode
    - initial_amount
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  handler.PageData:
    properties:
      list: {}
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  handler.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  handler.Verify2FARequest:
    properties:
      code:
        example: "123456"
        type: string
      pre_auth_token:
        type: string
      user_id:
        example: 1
        type: integer
    required:
    - code
    - pre_auth_token
    - user_id
    type: object
host: localhost:8080
info:
  contact: {}
  description: 卡密管理系统 API 文档
  title: CloudKey API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户名密码验证，成功后返回 pre_auth_token 用于后续 TOTP 验证
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '成功: data 含 require_totp/user_id/pre_auth_token'
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 账号已被锁定
          schema:
            $ref: '#/definitions/handler.Response'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 用户名密码登录
      tags:
      - 认证
  /auth/totp/confirm-init:
    post:
      consumes:
      - application/json
      description: 首次登录用户确认 TOTP 绑定后自动登录，返回 JWT
      parameters:
      - description: 验证参数
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 绑定成功并返回 JWT
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  properties:
                    role:
                      type: string
                    tenant_id:
                      type: integer
                    token:
                      type: string
                    token_type:
                      type: string
                    username:
                      type: string
                  type: object
              type: object
        "400":
          description: 验证码错误
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: pre_auth_token 无效
          schema:
            $ref: '#/definitions/handler.Response'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 确认 TOTP 绑定并登录
      tags:
      - 认证
  /auth/totp/setup-init:
    post:
      consumes:
      - application/json
      description: 首次登录用户生成 TOTP 密钥，需先通过密码验证获取 user_id
      parameters:
      - description: 用户ID
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 生成成功
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  properties:
                    secret:
                      type: string
                    url:
                      type: string
                  type: object
              type: object
        "401":
          description: 用户不存在或 TOTP 已设置
          schema:
            $ref: '#/definitions/handler.Response'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 初始化 TOTP 绑定
      tags:
      - 认证
  /auth/verify-2fa:
    post:
      consumes:
      - application/json
      description: 登录成功后使用 pre_auth_token + TOTP 验证码完成认证，返回 JWT
      parameters:
      - description: 验证参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: 验证成功，返回 JWT
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  properties:
                    role:
                      type: string
                    tenant_id:
                      type: integer
                    token:
                      type: string
                    token_type:
                      type: string
                    username:
                      type: string
                  type: object
              type: object
        "401":
          description: 验证码错误或 pre_auth_token 无效
          schema:
            $ref: '#/definitions/handler.Response'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/handler.Response'
      summary: TOTP 二次验证
      tags:
      - 认证
  /key/consume:
    post:
      consumes:
      - application/json
      description: 扣减指定卡密的剩余额度
      parameters:
      - description: 扣减参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ConsumeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 扣减结果
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 参数错误或卡密无效
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 扣减卡密额度
      tags:
      - 卡密公共API
  /key/status:
    get:
      description: 根据卡密值查询卡密状态，不扣减额度
      parameters:
      - description: 卡密值
        in: query
        name: sk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 卡密状态信息
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 缺少卡密参数
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 卡密不存在
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询卡密状态
      tags:
      - 卡密公共API
  /service/keys:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 分页卡密列表
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.PageData'
              type: object
        "401":
          description: 服务账号密钥无效
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密列表
      tags:
      - 服务账号API
    post:
      consumes:
      - application/json
      description: 通过 X-Service-Key 认证，服务账号创建卡密
      parameters:
      - description: 卡密参数
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 服务账号密钥无效
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - ServiceKeyAuth: []
      summary: 服务账号创建卡密
      tags:
      - 服务账号API
  /super/configs:
    get:
      produces:
      - application/json
      responses:
