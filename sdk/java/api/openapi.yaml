            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号禁用卡密
      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /service/keys/{id}/enable:
    patch:
      parameters:
      - description: 卡密ID
        in: path
