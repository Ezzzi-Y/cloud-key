              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 参数错误
      security:
      - ApiKeyAuth: []
      summary: 更新租户
      tags:
      - 系统管理
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /super/tenants/{id}/reset-password:
