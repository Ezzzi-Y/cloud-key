  /super/totp/setup:
    post:
      description: 已登录用户生成新的 TOTP 密钥，用于更换验证器
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_auth_totp_setup_init_post_200_response"
          description: 生成成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 未认证
      security:
      - ApiKeyAuth: []
      summary: 生成 TOTP 密钥
      tags:
      - 认证
      x-accepts:
      - application/json
  /tenant/keys:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: 每页数量
        in: query
        name: page_size
        schema:
          default: 20
          type: integer
      - description: "状态过滤: unused/used/disabled/expired"
        in: query
        name: status
        schema:
          type: string
      - description: 关键字搜索
        in: query
        name: search
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_service_keys_get_200_response"
          description: 分页卡密列表
      security:
      - ApiKeyAuth: []
      summary: 卡密列表
      tags:
      - 租户-卡密管理
      x-accepts:
