      x-accepts:
      - application/json
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 租户参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_super_tenants_post_200_response"
          description: 创建成功
        "400":
          content:
