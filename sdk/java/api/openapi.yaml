          description: 参数错误
      security:
      - ApiKeyAuth: []
      summary: 创建租户
      tags:
      - 系统管理
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /super/tenants/{id}:
