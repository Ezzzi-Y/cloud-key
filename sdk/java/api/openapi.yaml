openapi: 3.0.1
info:
  contact: {}
  description: 卡密管理系统 - 服务账号 SDK
  title: CloudKey Service Account API
  version: "1.2"
servers:
- url: //localhost:8080/api
paths:
  /service/keys:
    get:
      operationId: listKeys
      parameters:
      - description: 页码
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - description: 每页数量
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - description: "状态过滤: unused/used/disabled/expired"
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - unused
          - used
          - disabled
          - expired
          type: string
        style: form
      - description: 关键字搜索
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyListResponse"
          description: 分页卡密列表
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密列表
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
    post:
      description: 通过 X-Service-Key 认证，服务账号创建卡密
      operationId: createKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
        description: 卡密参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
          description: 创建成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号创建卡密
      tags:
      - ServiceKeys
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/consume:
    post:
      description: 通过 X-Service-Key 认证，扣减指定卡密的剩余额度
      operationId: consumeKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeRequest"
        description: 扣减参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumeResponse"
          description: 扣减结果
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 参数错误或卡密无效
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号扣减卡密额度
      tags:
      - ServiceKeys
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/export:
    get:
      operationId: exportKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 导出数据（文本格式）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号导出卡密（文本格式）
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/export/json:
    get:
      operationId: exportKeysJson
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportKeysResponse"
          description: 导出数据 JSON 数组
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号导出卡密（JSON 格式）
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/status:
    get:
      description: 通过 X-Service-Key 认证，根据卡密值查询状态
      operationId: getKeyStatus
      parameters:
      - description: 卡密值
        explode: true
        in: query
        name: sk
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyStatusResponse"
          description: 卡密状态信息
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 缺少卡密参数
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 卡密不存在
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密状态
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/{id}:
    delete:
      operationId: deleteKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 删除成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号删除卡密
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
    get:
      operationId: getKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyResponse"
          description: 卡密详情
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 卡密不存在
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密详情
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
    patch:
      operationId: updateKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKeyRequest"
        description: 更新字段
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 更新成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 参数错误
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号更新卡密
      tags:
      - ServiceKeys
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/{id}/disable:
    patch:
      operationId: disableKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 禁用成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号禁用卡密
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/{id}/enable:
    patch:
      operationId: enableKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 启用成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号启用卡密
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
components:
  schemas:
    Result:
      example:
        code: 2
        message: message
        data: "{}"
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
      type: object
    Key:
      example:
        id: 6
        tenant_id: 1
        alias: alias
        key_prefix: key_prefix
        key_suffix: key_suffix
        billing_mode: count
        initial_amount: 5
        remaining_amount: 5
        status: unused
        created_by: created_by
        created_at: 2000-01-23T04:56:07.000+00:00
        updated_at: 2000-01-23T04:56:07.000+00:00
        used_at: 2000-01-23T04:56:07.000+00:00
        expire_at: 2000-01-23T04:56:07.000+00:00
        max_usage: 2
