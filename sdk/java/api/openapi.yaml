          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 启用成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
