openapi: 3.0.1
info:
  contact: {}
  description: 卡密管理系统 - 服务账号 SDK
  title: CloudKey Service Account API
  version: "1.0"
servers:
- url: //localhost:8080/api
paths:
  /service/keys:
    get:
      parameters:
      - description: 页码
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - description: 每页数量
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - description: "状态过滤: unused/used/disabled/expired"
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: 关键字搜索
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_service_keys_get_200_response"
          description: 分页卡密列表
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密列表
      tags:
      - 服务账号API
      x-accepts:
      - application/json
    post:
      description: 通过 X-Service-Key 认证，服务账号创建卡密
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 卡密参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 创建成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号创建卡密
      tags:
      - 服务账号API
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/consume:
    post:
      description: 通过 X-Service-Key 认证，扣减指定卡密的剩余额度
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.serviceConsumeReq"
        description: 扣减参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 扣减结果
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 参数错误或卡密无效
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号扣减卡密额度
      tags:
      - 服务账号API
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/export:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 导出数据
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号导出卡密（文本格式）
      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /service/keys/export/json:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 导出数据 JSON 数组
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号导出卡密（JSON 格式）
      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /service/keys/status:
    get:
      description: 通过 X-Service-Key 认证，根据卡密值查询状态
      parameters:
      - description: 卡密值
        explode: true
        in: query
        name: sk
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 卡密状态信息
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 缺少卡密参数
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 卡密不存在
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密状态
      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /service/keys/{id}:
    delete:
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 删除成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号删除卡密
      tags:
      - 服务账号API
      x-accepts:
      - application/json
    get:
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 卡密详情
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 卡密不存在
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密详情
      tags:
      - 服务账号API
      x-accepts:
      - application/json
    patch:
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 更新字段
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 更新成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 参数错误
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号更新卡密
      tags:
      - 服务账号API
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/{id}/disable:
    patch:
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 禁用成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号禁用卡密
      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /service/keys/{id}/enable:
    patch:
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 启用成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号启用卡密
      tags:
      - 服务账号API
      x-accepts:
      - application/json
components:
  schemas:
    handler.PageData:
      example:
        list: "{}"
        page: 6
        page_size: 1
        total: 5
      properties:
        list:
          type: object
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      type: object
    handler.Response:
      example:
        code: 0
        data: "{}"
        message: message
      properties:
        code:
          type: integer
        data:
          type: object
        message:
          type: string
      type: object
    handler.serviceConsumeReq:
      properties:
        amount:
          type: integer
        key:
          type: string
      required:
      - key
      type: object
    _service_keys_get_200_response:
      allOf:
      - $ref: "#/components/schemas/handler.Response"
      - properties:
          data:
            $ref: "#/components/schemas/handler.PageData"
        type: object
      example:
        code: 0
        data:
          list: "{}"
          page: 6
          page_size: 1
          total: 5
        message: message
  securitySchemes:
    ServiceKeyAuth:
      description: 服务账号密钥
      in: header
      name: X-Service-Key
      type: apiKey

