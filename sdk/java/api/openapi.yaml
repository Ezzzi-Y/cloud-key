openapi: 3.0.1
info:
  contact: {}
  description: 卡密管理系统 API 文档
  title: CloudKey API
  version: "1.0"
servers:
- url: //localhost:8080/api
paths:
  /auth/login:
    post:
      description: 用户名密码验证，成功后返回 pre_auth_token 用于后续 TOTP 验证
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.LoginRequest"
        description: 登录参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: "成功: data 含 require_totp/user_id/pre_auth_token"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 用户名或密码错误
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 账号已被锁定
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 请求过于频繁
      summary: 用户名密码登录
      tags:
      - 认证
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/totp/confirm-init:
    post:
      description: 首次登录用户确认 TOTP 绑定后自动登录，返回 JWT
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 验证参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_auth_totp_confirm_init_post_200_response"
          description: 绑定成功并返回 JWT
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 验证码错误
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: pre_auth_token 无效
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 请求过于频繁
      summary: 确认 TOTP 绑定并登录
      tags:
      - 认证
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/totp/setup-init:
    post:
      description: 首次登录用户生成 TOTP 密钥，需先通过密码验证获取 user_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 用户ID
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_auth_totp_setup_init_post_200_response"
          description: 生成成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 用户不存在或 TOTP 已设置
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 请求过于频繁
      summary: 初始化 TOTP 绑定
      tags:
      - 认证
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/verify-2fa:
    post:
      description: 登录成功后使用 pre_auth_token + TOTP 验证码完成认证，返回 JWT
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.Verify2FARequest"
        description: 验证参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_auth_totp_confirm_init_post_200_response"
          description: 验证成功，返回 JWT
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 验证码错误或 pre_auth_token 无效
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 请求过于频繁
      summary: TOTP 二次验证
      tags:
      - 认证
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: 每页数量
        in: query
        name: page_size
        schema:
          default: 20
          type: integer
      - description: "状态过滤: unused/used/disabled/expired"
        in: query
        name: status
        schema:
          type: string
      - description: 关键字搜索
        in: query
        name: search
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_service_keys_get_200_response"
          description: 分页卡密列表
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密列表
      tags:
      - 服务账号API
      x-accepts:
      - application/json
    post:
      description: 通过 X-Service-Key 认证，服务账号创建卡密
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 卡密参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 创建成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号创建卡密
      tags:
      - 服务账号API
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/consume:
    post:
      description: 通过 X-Service-Key 认证，扣减指定卡密的剩余额度
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.serviceConsumeReq"
        description: 扣减参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 扣减结果
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 参数错误或卡密无效
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号扣减卡密额度
      tags:
      - 服务账号API
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/export:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 导出数据
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号导出卡密（文本格式）
      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /service/keys/export/json:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 导出数据 JSON 数组
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号导出卡密（JSON 格式）
      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /service/keys/status:
    get:
      description: 通过 X-Service-Key 认证，根据卡密值查询状态
      parameters:
      - description: 卡密值
        in: query
        name: sk
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 卡密状态信息
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 缺少卡密参数
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 卡密不存在
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密状态
      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /service/keys/{id}:
    delete:
      parameters:
      - description: 卡密ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 删除成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号删除卡密
      tags:
      - 服务账号API
      x-accepts:
      - application/json
    get:
      parameters:
      - description: 卡密ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 卡密详情
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 卡密不存在
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密详情
      tags:
      - 服务账号API
      x-accepts:
      - application/json
    patch:
      parameters:
      - description: 卡密ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 更新字段
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 更新成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 参数错误
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号更新卡密
      tags:
      - 服务账号API
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/{id}/disable:
    patch:
      parameters:
      - description: 卡密ID
        in: path
        name: id
        required: true
