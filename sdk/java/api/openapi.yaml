      tags:
      - 服务账号API
      x-accepts:
      - application/json
  /super/configs:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 配置列表
      security:
      - ApiKeyAuth: []
      summary: 获取系统配置
      tags:
      - 系统管理
      x-accepts:
      - application/json
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: 配置数组
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 更新成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.Response"
          description: 参数错误
      security:
      - ApiKeyAuth: []
      summary: 更新系统配置
      tags:
      - 系统管理
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /super/login-logs:
    get:
      parameters:
      - description: 页码
        in: query
