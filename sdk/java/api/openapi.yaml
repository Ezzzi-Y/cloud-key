openapi: 3.0.1
info:
  contact: {}
  description: 卡密管理系统 - 服务账号 SDK
  title: CloudKey Service Account API
  version: "2.1"
servers:
- url: //localhost:8080/api
paths:
  /service/keys:
    get:
      operationId: listKeys
      parameters:
      - description: 页码
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - description: 每页数量
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - description: "状态过滤: active/exhausted/disabled/expired"
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - active
          - exhausted
          - disabled
          - expired
          type: string
        style: form
      - description: 关键字搜索
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyListResponse"
          description: 分页卡密列表
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密列表
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
    post:
      description: 通过 X-Service-Key 认证，服务账号创建卡密
      operationId: createKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
        description: 卡密参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
          description: 创建成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 租户已到期或已被禁用（code 4001=到期, 4002=禁用）
      security:
      - ServiceKeyAuth: []
      summary: 服务账号创建卡密
      tags:
      - ServiceKeys
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/consume:
    post:
      description: 通过 X-Service-Key 认证，扣减指定卡密的剩余额度
      operationId: consumeKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumeRequest"
        description: 扣减参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumeResponse"
          description: 扣减结果
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 参数错误或卡密无效
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 租户已到期或已被禁用（code 4001=到期, 4002=禁用）
      security:
      - ServiceKeyAuth: []
      summary: 服务账号扣减卡密额度
      tags:
      - ServiceKeys
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/export:
    get:
      operationId: exportKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 导出数据（文本格式）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号导出卡密（文本格式）
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/export/json:
    get:
      operationId: exportKeysJson
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportKeysResponse"
          description: 导出数据 JSON 数组
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 服务账号导出卡密（JSON 格式）
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/status:
    get:
      description: 通过 X-Service-Key 认证，根据卡密值查询状态
      operationId: getKeyStatus
      parameters:
      - description: 卡密值
        explode: true
        in: query
        name: sk
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyStatusResponse"
          description: 卡密状态信息
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 缺少卡密参数
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 卡密不存在
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密状态
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/{id}:
    delete:
      operationId: deleteKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 删除成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 租户已到期或已被禁用（code 4001=到期, 4002=禁用）
      security:
      - ServiceKeyAuth: []
      summary: 服务账号删除卡密
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
    get:
      operationId: getKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyResponse"
          description: 卡密详情
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 卡密不存在
      security:
      - ServiceKeyAuth: []
      summary: 服务账号查询卡密详情
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
    patch:
      operationId: updateKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKeyRequest"
        description: 更新字段
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 更新成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 参数错误
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 租户已到期或已被禁用（code 4001=到期, 4002=禁用）
      security:
      - ServiceKeyAuth: []
      summary: 服务账号更新卡密
      tags:
      - ServiceKeys
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/keys/{id}/disable:
    patch:
      operationId: disableKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 禁用成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 租户已到期或已被禁用（code 4001=到期, 4002=禁用）
      security:
      - ServiceKeyAuth: []
      summary: 服务账号禁用卡密
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/{id}/enable:
    patch:
      operationId: enableKey
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 启用成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 无效的卡密 ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 租户已到期或已被禁用（code 4001=到期, 4002=禁用）
      security:
      - ServiceKeyAuth: []
      summary: 服务账号启用卡密
      tags:
      - ServiceKeys
      x-accepts:
      - application/json
  /service/keys/{id}/adjust-balance:
    post:
      description: 通过 X-Service-Key 认证，增加或减少卡密额度（管理员行为），仅支持增量操作
      operationId: adjustBalance
      parameters:
      - description: 卡密ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustBalanceRequest"
        description: 调整参数
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustBalanceResponse"
          description: 调整结果
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 参数错误
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 租户已到期或已被禁用（code 4001=到期, 4002=禁用）
      security:
      - ServiceKeyAuth: []
      summary: 服务账号调整卡密额度
      tags:
      - ServiceKeys
      x-codegen-request-body-name: body
      x-content-type: application/json
      x-accepts:
      - application/json
  /service/balance-logs:
    get:
      operationId: listBalanceLogs
      parameters:
      - description: 页码
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - description: 每页数量
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - description: 卡密ID过滤
        explode: true
        in: query
        name: key_id
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: 操作人过滤
        explode: true
        in: query
        name: operator
        required: false
        schema:
          type: string
        style: form
      - description: 开始时间
        explode: true
        in: query
        name: start_time
        required: false
        schema:
          type: string
        style: form
      - description: 结束时间
        explode: true
        in: query
        name: end_time
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceLogListResponse"
          description: 分页额度流转日志
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 查询额度流转日志
      tags:
      - BalanceLogs
      x-accepts:
      - application/json
  /service/balance-logs/export:
    get:
      operationId: exportBalanceLogs
      parameters:
      - description: 卡密ID过滤
        explode: true
        in: query
        name: key_id
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: 操作人过滤
        explode: true
        in: query
        name: operator
        required: false
        schema:
          type: string
        style: form
      - description: 开始时间
        explode: true
        in: query
        name: start_time
        required: false
        schema:
          type: string
        style: form
      - description: 结束时间
        explode: true
        in: query
        name: end_time
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportBalanceLogsResponse"
          description: 导出数据
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: 服务账号密钥无效
      security:
      - ServiceKeyAuth: []
      summary: 导出额度流转日志
      tags:
      - BalanceLogs
      x-accepts:
      - application/json
components:
  schemas:
    Result:
      example:
        code: 2
        message: message
        data: "{}"
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
      type: object
    Key:
      example:
        id: 6
        tenant_id: 1
        alias: alias
        key_prefix: key_prefix
        key_suffix: key_suffix
        remaining_amount: 5
        status: active
        created_by: created_by
        created_at: 2000-01-23T04:56:07.000+00:00
        updated_at: 2000-01-23T04:56:07.000+00:00
        used_at: 2000-01-23T04:56:07.000+00:00
        expire_at: 2000-01-23T04:56:07.000+00:00
        max_usage: 2
      properties:
        id:
          format: int64
          type: integer
        tenant_id:
          format: int64
          type: integer
        alias:
          type: string
        key_prefix:
          type: string
        key_suffix:
          type: string
        remaining_amount:
          format: int64
          type: integer
        status:
          enum:
          - active
          - exhausted
          - disabled
          - expired
          type: string
        created_by:
          type: string
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
        used_at:
          format: date-time
          nullable: true
          type: string
        expire_at:
          format: date-time
          nullable: true
          type: string
        max_usage:
          format: int64
          nullable: true
          type: integer
      type: object
    PageData:
      example:
        list:
        - id: 6
          tenant_id: 1
          alias: alias
          key_prefix: key_prefix
          key_suffix: key_suffix
          remaining_amount: 5
          status: active
          created_by: created_by
          created_at: 2000-01-23T04:56:07.000+00:00
          updated_at: 2000-01-23T04:56:07.000+00:00
          used_at: 2000-01-23T04:56:07.000+00:00
          expire_at: 2000-01-23T04:56:07.000+00:00
          max_usage: 2
        - id: 6
          tenant_id: 1
          alias: alias
          key_prefix: key_prefix
          key_suffix: key_suffix
          remaining_amount: 5
          status: active
          created_by: created_by
          created_at: 2000-01-23T04:56:07.000+00:00
          updated_at: 2000-01-23T04:56:07.000+00:00
          used_at: 2000-01-23T04:56:07.000+00:00
          expire_at: 2000-01-23T04:56:07.000+00:00
          max_usage: 2
        total: 7
        page: 9
        page_size: 3
      properties:
        list:
          items:
            $ref: "#/components/schemas/Key"
          type: array
        total:
          format: int64
          type: integer
        page:
          type: integer
        page_size:
          type: integer
      type: object
    CreateKeyRequest:
      example:
        alias: alias
        remaining_amount: 0
        expire_at: 2000-01-23T04:56:07.000+00:00
        max_usage: 6
      properties:
        alias:
          type: string
        remaining_amount:
          format: int64
          type: integer
        expire_at:
          format: date-time
          nullable: true
          type: string
        max_usage:
          format: int64
          nullable: true
          type: integer
      required:
      - alias
      - remaining_amount
      type: object
    CreateKeyData:
      example:
        raw_key: raw_key
        key:
          id: 6
          tenant_id: 1
          alias: alias
          key_prefix: key_prefix
          key_suffix: key_suffix
          remaining_amount: 5
          status: active
          created_by: created_by
          created_at: 2000-01-23T04:56:07.000+00:00
          updated_at: 2000-01-23T04:56:07.000+00:00
          used_at: 2000-01-23T04:56:07.000+00:00
          expire_at: 2000-01-23T04:56:07.000+00:00
          max_usage: 2
      properties:
        raw_key:
          description: 创建时返回的原始密钥（仅此处可见）
          type: string
        key:
          $ref: "#/components/schemas/Key"
      type: object
    CreateKeyResponse:
      allOf:
      - $ref: "#/components/schemas/Result"
      - properties:
          data:
            $ref: "#/components/schemas/CreateKeyData"
        type: object
      example:
        code: 0
        message: message
        data:
          raw_key: raw_key
          key:
            id: 6
            tenant_id: 1
            alias: alias
            key_prefix: key_prefix
            key_suffix: key_suffix
            remaining_amount: 5
            status: active
            created_by: created_by
            created_at: 2000-01-23T04:56:07.000+00:00
            updated_at: 2000-01-23T04:56:07.000+00:00
            used_at: 2000-01-23T04:56:07.000+00:00
            expire_at: 2000-01-23T04:56:07.000+00:00
            max_usage: 2
    KeyListResponse:
      allOf:
      - $ref: "#/components/schemas/Result"
      - properties:
          data:
            $ref: "#/components/schemas/PageData"
        type: object
      example:
        code: 0
        message: message
        data:
          list:
          - id: 6
            tenant_id: 1
            alias: alias
            key_prefix: key_prefix
            key_suffix: key_suffix
            remaining_amount: 5
            status: active
            created_by: created_by
            created_at: 2000-01-23T04:56:07.000+00:00
            updated_at: 2000-01-23T04:56:07.000+00:00
            used_at: 2000-01-23T04:56:07.000+00:00
            expire_at: 2000-01-23T04:56:07.000+00:00
            max_usage: 2
          - id: 6
            tenant_id: 1
            alias: alias
            key_prefix: key_prefix
            key_suffix: key_suffix
            remaining_amount: 5
            status: active
            created_by: created_by
            created_at: 2000-01-23T04:56:07.000+00:00
            updated_at: 2000-01-23T04:56:07.000+00:00
            used_at: 2000-01-23T04:56:07.000+00:00
            expire_at: 2000-01-23T04:56:07.000+00:00
            max_usage: 2
          total: 7
          page: 9
          page_size: 3
    KeyResponse:
      allOf:
      - $ref: "#/components/schemas/Result"
      - properties:
          data:
            $ref: "#/components/schemas/Key"
        type: object
      example:
        code: 0
        message: message
        data:
          id: 6
          tenant_id: 1
          alias: alias
          key_prefix: key_prefix
          key_suffix: key_suffix
          remaining_amount: 5
          status: active
          created_by: created_by
          created_at: 2000-01-23T04:56:07.000+00:00
          updated_at: 2000-01-23T04:56:07.000+00:00
          used_at: 2000-01-23T04:56:07.000+00:00
          expire_at: 2000-01-23T04:56:07.000+00:00
          max_usage: 2
    ConsumeRequest:
      example:
        key: key
        amount: 0
      properties:
        key:
          type: string
        amount:
          format: int64
          type: integer
      required:
      - key
      type: object
    ConsumeResult:
      example:
        remaining_amount: 6
        status: active
        exhausted: true
      properties:
        remaining_amount:
          format: int64
          type: integer
