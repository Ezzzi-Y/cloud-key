      type: object
    CreateKeyResponse:
      allOf:
      - $ref: "#/components/schemas/Result"
      - properties:
          data:
            $ref: "#/components/schemas/CreateKeyData"
        type: object
      example:
        code: 0
        message: message
        data:
          raw_key: raw_key
          key:
            id: 6
            tenant_id: 1
            alias: alias
